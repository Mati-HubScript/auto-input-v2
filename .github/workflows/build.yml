name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main

      - name: Upload the mod
        uses: actions/upload-artifact@v4
        with:
          name: auto-input
          path: |
            build/*.geode
            output/*.geode
